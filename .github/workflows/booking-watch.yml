name: booking-watch

on:
  # schedule:
  #   # Every ~10 min, offset off :00/:10 etc. GitHub delays/drops scheduled
  #   # runs during high load (worst at the top of the hour), so the odd minutes
  #   # get served more reliably. Runs are still best-effort, not guaranteed.
  #   - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      config_file:
        description: "Config JSON filename"
        required: false
        default: "config.json"
      state_file:
        description: "State JSON filename"
        required: false
        default: "state.json"   # lets you trigger a manual run from the Actions tab

# Allow the workflow to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          CONFIG_PATH: ${{ github.event.inputs.config_file || 'config.json' }}
          STATE_PATH: ${{ github.event.inputs.state_file || 'state.json' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Route through an India egress so BookMyShow doesn't 403 the
          # US-based GitHub runner. Set SCRAPERAPI_KEY (or PROXY_URL) as a secret.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python poller.py

      - name: Persist state
        env:
          STATE_PATH: ${{ github.event.inputs.state_file || 'state.json' }}
        run: |
          if [ -n "$(git status --porcelain "$STATE_PATH")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$STATE_PATH"
            git commit -m "chore: update ${STATE_PATH} [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
